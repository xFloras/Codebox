name: CI

on:
  push:
      branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pre-pull image
        run: docker pull eclipse-temurin:21-jdk-alpine

      - name: Make runner executable
        run: chmod +x runSubmission.sh mvnw

      - name: Run tests
        run: ./mvnw -B verify
